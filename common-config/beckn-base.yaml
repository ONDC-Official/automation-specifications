components:
  schemas:
    Ack:
      properties:
        status:
          description: The status of the acknowledgement. If the request passes the
            validation criteria of the BPP, then this is set to ACK. If a BPP responds
            with status = `ACK` to a request, it is required to respond with a callback.
            If the request fails the validation criteria, then this is set to NACK.
            Additionally, if a BPP does not intend to respond with a callback even
            after the request meets the validation criteria, it should set this value
            to `NACK`.
          enum:
          - ACK
          - NACK
          type: string
        tags:
          description: A list of tags containing any additional information sent along
            with the Acknowledgement.
          items:
            $ref: '#/components/schemas/TagGroup'
          type: array
      type: object
    Action:
      properties:
        action_by:
          description: Describes the actor who performed the action
          type: string
        actor_details:
          properties:
            name:
              description: Describes id of the actor
              type: string
          type: object
        descriptor:
          allOf:
          - $ref: '#/components/schemas/DescriptorIgm'
          - properties:
              code:
                enum:
                - OPEN
                - PROCESSING
                - CLOSED
                - CASCADED
                - INFO_REQUESTED
                - INFO_PROCESSING
                - INFO_PROVIDED
                - INFO_NOT_AVAILABLE
                - RESOLUTION_PROPOSED
                - RESOLUTION_FORWARDED
                - RESOLUTION_PROCESSING
                - RESOLUTION_ACCEPTED
                - RESOLUTION_REJECTED
                - RESOLVED
                type: string
            type: object
        id:
          description: Describes id of the action
          type: string
        ref_id:
          description: Describes the reference id
          type: string
        ref_type:
          description: Describes the refence type
          type: string
        tags:
          description: List of tag objects
          items:
            properties:
              descriptor:
                properties:
                  code:
                    description: Descriptor code of the tag group
                    type: string
                required:
                - code
                type: object
              list:
                description: List of key_value tag entries
                items:
                  properties:
                    descriptor:
                      properties:
                        code:
                          description: Descriptor code of the individual tag
                          type: string
                      required:
                      - code
                      type: object
                    value:
                      description: Value of the tag
                      enum:
                      - THUMBS_UP
                      - THUMBS_DOWN
                      type: string
                  required:
                  - descriptor
                  - value
                  type: object
                type: array
            required:
            - descriptor
            - list
            type: object
          type: array
        updated_at:
          description: Timestamp in RFC3339 format when the action was updated
          format: date-time
          type: string
      type: object
    AddOn:
      properties:
        descriptor:
          $ref: '#/components/schemas/Descriptor'
        id:
          description: Provider-defined ID of the add-on
          type: string
        price:
          $ref: '#/components/schemas/Price'
        quantity:
          $ref: '#/components/schemas/ItemQuantity'
        tags:
          items:
            $ref: '#/components/schemas/TagGroup'
          type: array
      type: object
    AdditionalInfoRequired:
      properties:
        info_provided:
          $ref: '#/components/schemas/SupplementaryInformation'
          type: object
        info_required:
          $ref: '#/components/schemas/SupplementaryInformation'
          type: object
      type: object
    Address:
      description: Describes a postal address.
      type: string
    Agent:
      properties:
        contact:
          $ref: '#/components/schemas/Contact'
        organization:
          $ref: '#/components/schemas/Organization'
        person:
          $ref: '#/components/schemas/Person'
        rating:
          $ref: '#/components/schemas/Rating/properties/value'
      type: object
    Authorization:
      properties:
        status:
          description: Status of the token
          type: string
        token:
          description: Token used for authorization. This is typically generated at
            the BPP. The BAP can send this value to the user via any channel that
            it uses to authenticate the user like SMS, Email, Push notification, or
            in-app rendering.
          type: string
        type:
          description: Type of authorization mechanism used. The allowed values for
            this field can be published as part of the network policy.
          type: string
        valid_from:
          description: Timestamp in RFC3339 format from which token is valid
          format: date-time
          type: string
        valid_to:
          description: Timestamp in RFC3339 format until which token is valid
          format: date-time
          type: string
      type: object
    Billing:
      properties:
        address:
          $ref: '#/components/schemas/Address'
        city:
          $ref: '#/components/schemas/City'
        email:
          description: Email address where the bill is sent to
          format: email
          type: string
        name:
          description: Name of the billable entity
          type: string
        organization:
          $ref: '#/components/schemas/Organization'
        phone:
          description: Phone number of the billable entity
          type: string
        state:
          $ref: '#/components/schemas/State'
        tax_id:
          description: ID of the billable entity as recognized by the taxation authority
          type: string
        time:
          $ref: '#/components/schemas/Time'
      type: object
    Cancellation:
      properties:
        additional_description:
          $ref: '#/components/schemas/Descriptor'
        cancelled_by:
          enum:
          - CONSUMER
          - PROVIDER
          type: string
        reason:
          $ref: '#/components/schemas/Option'
        time:
          description: Date-time when the order was cancelled by the buyer
          format: date-time
          type: string
      type: object
    CancellationTerm:
      properties:
        cancel_by:
          $ref: '#/components/schemas/Time'
        cancellation_eligible:
          description: Indicates if cancellation is eligible
          type: boolean
        cancellation_fee:
          $ref: '#/components/schemas/Fee'
        external_ref:
          $ref: '#/components/schemas/MediaFile'
        fulfillment_state:
          $ref: '#/components/schemas/FulfillmentState'
        reason_required:
          description: Indicates whether a reason is required to cancel the order
          type: boolean
        return_terms:
          description: Return terms associated with cancellation
          items:
            $ref: '#/components/schemas/ReturnTerm'
          type: array
        xinput:
          $ref: '#/components/schemas/XInput'
      type: object
    Catalog:
      properties:
        descriptor:
          $ref: '#/components/schemas/Descriptor'
        exp:
          description: Timestamp after which catalog will expire
          format: date-time
          type: string
        fulfillments:
          description: Fulfillment modes offered at the BPP level. This is used when
            a BPP itself offers fulfillments on behalf of the providers it has onboarded.
          items:
            $ref: '#/components/schemas/Fulfillment'
          type: array
        offers:
          description: Offers at the BPP-level. This is common across all providers
            onboarded by the BPP.
          items:
            $ref: '#/components/schemas/Offer'
          type: array
        payments:
          description: Payment terms offered by the BPP for all transactions. This
            can be overriden at the provider level.
          items:
            $ref: '#/components/schemas/Payment'
          type: array
        providers:
          items:
            $ref: '#/components/schemas/Provider'
          type: array
        tags:
          items:
            $ref: '#/components/schemas/TagGroup'
          type: array
        ttl:
          description: Duration in seconds after which this catalog will expire
          type: string
      type: object
    Category:
      properties:
        descriptor:
          $ref: '#/components/schemas/Descriptor'
        id:
          description: ID of the category
          type: string
        parent_category_id:
          $ref: '#/components/schemas/Category/properties/id'
        tags:
          items:
            $ref: '#/components/schemas/TagGroup'
          type: array
        time:
          $ref: '#/components/schemas/Time'
        ttl:
          description: Time to live for an instance of this schema
      type: object
    Circle:
      properties:
        gps:
          $ref: '#/components/schemas/Gps'
        radius:
          $ref: '#/components/schemas/Scalar'
      type: object
    City:
      properties:
        code:
          description: City code
          type: string
        name:
          description: Name of the city
          type: string
      type: object
    Complainant:
      properties:
        contact:
          allOf:
          - $ref: '#/components/schemas/Contact'
          - required:
            - phone
            type: object
        person:
          $ref: '#/components/schemas/Person'
      type: object
    ComplainantAction:
      properties:
        complainant_action:
          description: "Describes the action taken by the complainant who has raised\
            \ the issue. \nthe value should be populated when the complainant has\
            \ taken any of the below actions to anotate the action taken. the actions\
            \ can be, \n### Actions\n1. Complainant can ```open``` the issue if he\
            \ isn't satisfied with the products or services he has purchased or used\
            \ \n2. Complainant can ```escalate``` the issue if he isn't satisfied\
            \ with the issue resolution\n3. Complainant can ```close``` the issue\
            \ if he doesn't expect any more additonal action on the issue and he is\
            \ satisfied with the resolution/actions taken on the issue till the time\
            \ of closure of the issue.\n"
          enum:
          - OPEN
          - ESCALATE
          - CLOSE
          type: string
        short_desc:
          description: details of the remarks when the issue status is changed, can
            be captured when the complainant triggers an action
          type: string
        updated_at:
          description: timestamp for the capturing the time an issue status was last
            updated
          format: date-time
          type: string
        updated_by:
          $ref: '#/components/schemas/Organization'
      type: object
    Contact:
      properties:
        email:
          type: string
        jcard:
          additionalProperties: false
          description: A Jcard object as per draft-ietf-jcardcal-jcard-03 specification
          type: object
        phone:
          type: string
      type: object
    Context:
      properties:
        action:
          description: The Beckn protocol method being called by the sender and executed
            at the receiver.
          type: string
        bap_id:
          allOf:
          - description: A globally unique identifier of the platform, Typically it
              is the fully qualified domain name (FQDN) of the platform.
            type: string
          description: Subscriber ID of the BAP
        bap_uri:
          allOf:
          - description: The callback URL of the Subscriber. This should necessarily
              contain the same domain name as set in `subscriber_id``.
            format: uri
            type: string
          description: Subscriber URL of the BAP for accepting callbacks from BPPs.
        bpp_id:
          $ref: '#/components/schemas/Context/properties/bap_id/allOf/0'
        bpp_uri:
          $ref: '#/components/schemas/Context/properties/bap_uri/allOf/0'
        domain:
          allOf:
          - $ref: '#/components/schemas/Domain/properties/code'
            type: string
          description: Domain code that is relevant to this transaction context
        key:
          description: The encryption public key of the sender
          type: string
        location:
          $ref: '#/components/schemas/Location'
        message_id:
          description: This is a unique value which persists during a request / callback
            cycle. Since beckn protocol APIs are asynchronous, BAPs need a common
            value to match an incoming callback from a BPP to an earlier call. This
            value can also be used to ignore duplicate messages coming from the BPP.
            It is recommended to generate a fresh message_id for every new interaction.
            When sending unsolicited callbacks, BPPs must generate a new message_id.
          format: uuid
          type: string
        timestamp:
          description: Time of request generation in RFC3339 format
          format: date-time
          type: string
        transaction_id:
          description: This is a unique value which persists across all API calls
            from `search` through `confirm`. This is done to indicate an active user
            session across multiple requests. The BPPs can use this value to push
            personalized recommendations, and dynamic offerings related to an ongoing
            transaction despite being unaware of the user active on the BAP.
          format: uuid
          type: string
        ttl:
          description: The duration in ISO8601 format after timestamp for which this
            message holds valid
          type: string
        version:
          description: Version of transaction protocol being used by the sender.
          type: string
      type: object
    Country:
      properties:
        code:
          description: Country code as per ISO 3166-1 and ISO 3166-2 format
          type: string
        name:
          description: Name of the country
          type: string
      type: object
    Credential:
      properties:
        id:
          type: string
        type:
          default: VerifiableCredential
          type: string
        url:
          description: URL of the credential
          format: uri
          type: string
      type: object
    Customer:
      properties:
        contact:
          $ref: '#/components/schemas/Contact'
        organization:
          $ref: '#/components/schemas/Organization'
        person:
          $ref: '#/components/schemas/Person'
      type: object
    DecimalValue:
      description: Describes a numerical value in decimal form
      pattern: '[+-]?([0-9]*[.])?[0-9]+'
      type: string
    Descriptor:
      properties:
        additional_desc:
          additionalProperties: false
          properties:
            content_type:
              enum:
              - text/plain
              - text/html
              - application/json
              type: string
            url:
              type: string
          type: object
        code:
          type: string
        images:
          items:
            $ref: '#/components/schemas/Image'
          type: array
        long_desc:
          type: string
        media:
          items:
            $ref: '#/components/schemas/MediaFile'
          type: array
        name:
          type: string
        short_desc:
          type: string
        symbol:
          description: A symbol or icon code for the descriptor
          type: string
      type: object
    DescriptorIgm:
      properties:
        3d_render:
          format: uri
          type: string
        additional_desc:
          additionalProperties: false
          properties:
            content_type:
              enum:
              - text/plain
              - text/html
              - application/json
              type: string
            url:
              type: string
          type: object
        audio:
          format: uri
          type: string
        code:
          type: string
        images:
          items:
            $ref: '#/components/schemas/ImageIgm'
          type: array
        long_desc:
          type: string
        media:
          items:
            $ref: '#/components/schemas/MediaFile'
          type: array
        name:
          type: string
        short_desc:
          type: string
        symbol:
          type: string
        tags:
          description: A list of tags containing any additional information sent along
            with the Acknowledgement.
          items:
            $ref: '#/components/schemas/TagGroup'
          type: array
      type: object
    Domain:
      properties:
        additional_info:
          $ref: '#/components/schemas/MediaFile'
        code:
          description: Standard code representing the domain. The standard is usually
            published as part of the network policy. Furthermore, the network facilitator
            should also provide a mechanism to provide the supported domains of a
            network.
        name:
          description: Name of the domain
          type: string
      type: object
    Duration:
      description: Describes duration as per ISO8601 format
      type: string
    Error:
      properties:
        code:
          description: Standard error code. For full list of error codes, refer to
            docs/protocol-drafts/BECKN-005-ERROR-CODES-DRAFT-01.md of this repo"
          type: string
        message:
          description: Human readable message describing the error. Used mainly for
            logging. Not recommended to be shown to the user.
          type: string
        paths:
          description: Path to json schema generating the error. Used only during
            json schema validation errors
          type: string
        tags:
          description: Tags associated with the error
          items:
            $ref: '#/components/schemas/TagGroup'
          type: array
        type:
          description: Type or category of the error
          enum:
          - CONTEXT-ERROR
          - CORE-ERROR
          - DOMAIN-ERROR
          - JSON-SCHEMA-ERROR
          - POLICY-ERROR
          type: string
      type: object
    Faq:
      properties:
        answer:
          type: string
        question:
          type: string
      type: object
    Fee:
      properties:
        amount:
          $ref: '#/components/schemas/Price'
        percentage:
          $ref: '#/components/schemas/DecimalValue'
      type: object
    Form:
      properties:
        data:
          additionalProperties: true
          description: The form submission data (free-form)
          type: object
        id:
          description: The form identifier.
          type: string
        mime_type:
          description: This field indicates the nature and format of the form received
            by querying the url. MIME types are defined and standardized in IETF's
            RFC 6838.
          enum:
          - text/html
          - application/html
          - application/xml
          - TEXT/HTML-MULTI
          - NONE
          type: string
        multiple_submissions:
          type: boolean
        multiple_sumbissions:
          description: 'Typo in ONDC spec: should be corrected to multiple_submissions domain-by-domain with backward compatibility management'
          type: boolean
        resubmit:
          type: boolean
        url:
          description: The URL from where the form can be fetched. The content fetched
            from the url must be processed as per the mime_type specified in this
            object. Once fetched, the rendering platform can choosed to render the
            form as-is as an embeddable element; or process it further to blend with
            the theme of the application. In case the interface is non-visual, the
            the render can process the form data and reproduce it as per the standard
            specified in the form.
          format: uri
          type: string
      type: object
    Fulfillment:
      properties:
        agent:
          $ref: '#/components/schemas/Agent'
        contact:
          $ref: '#/components/schemas/Contact'
        customer:
          $ref: '#/components/schemas/Customer'
        id:
          description: Unique reference ID to the fulfillment of an order
          type: string
        path:
          description: The physical path taken by the agent that can be rendered on
            a map. The allowed format of this property can be set by the network.
          type: string
        rateable:
          description: Whether the fulfillment can be rated or not
          type: boolean
        rating:
          $ref: '#/components/schemas/Rating/properties/value'
        state:
          $ref: '#/components/schemas/FulfillmentState'
        stops:
          description: The list of logical stops encountered during the fulfillment
            of an order.
          items:
            $ref: '#/components/schemas/Stop'
          type: array
        tags:
          items:
            $ref: '#/components/schemas/TagGroup'
          type: array
        tracking:
          default: false
          description: Indicates whether the fulfillment allows tracking
          type: boolean
        type:
          description: A code that describes the mode of fulfillment. This is typically
            set when there are multiple ways an order can be fulfilled. For example,
            a retail order can be fulfilled either via store pickup or a home delivery.
            Similarly, a medical consultation can be provided either in-person or
            via tele-consultation. The network policy must publish standard fulfillment
            type codes for the different modes of fulfillment.
          type: string
        vehicle:
          $ref: '#/components/schemas/Vehicle'
      type: object
    FulfillmentState:
      properties:
        descriptor:
          $ref: '#/components/schemas/Descriptor'
        updated_at:
          format: date-time
          type: string
        updated_by:
          description: ID of entity which changed the state
          type: string
      type: object
    GRO:
      properties:
        contact:
          $ref: '#/components/schemas/Contact'
          required:
          - phone
          - email
        gro_type:
          description: "Indicates the system through which the GRO is assigned to\
            \ this issue. \n### TYPES\n    1. Intefacing NP GRO : indicating the GRO\
            \ is assigned by the NP where or through which the issue is raised\n \
            \   2. Transaction Counterparty NP GRO : indicating the GRO is assigned\
            \ by the first level of counterparty network provider with which the interfacing\
            \ NP is interacting with to get an issue resolution.\n    3. Cascaded\
            \ Counterparty NP GRO : indicating the GRO is assigned by the second or\
            \ any further downstream levels of counterparty network provider, with\
            \ which the NP is interacting with, to get an issue resolution.\n"
          enum:
          - INTEFACING-NP-GRO
          - TRANSACTION-COUNTERPARTY-NP-GRO
          - CASCADED-COUNTERPARTY-NP-GRO
          type: string
        person:
          $ref: '#/components/schemas/Person'
      type: object
    Gps:
      description: Describes a GPS coordinate
      pattern: ^[-+]?([1-8]?\d(\.\d+)?|90(\.0+)?),\s*[-+]?(180(\.0+)?|((1[0-7]\d)|([1-9]?\d))(\.\d+)?)$
      type: string
    Image:
      properties:
        height:
          description: Height of the image in pixels
          type: string
        size_type:
          description: The size of the image. The network policy can define the default
            dimensions of each type
          enum:
          - xs
          - sm
          - md
          - lg
          - xl
          - custom
          type: string
        url:
          description: URL to the image. This can be a data url or an remote url
          format: uri
          type: string
        width:
          description: Width of the image in pixels
          type: string
      type: object
    ImageIgm:
      properties:
        size_type:
          type: string
        url:
          format: uri
          type: string
      type: object
    Intent:
      properties:
        category:
          $ref: '#/components/schemas/Category'
        descriptor:
          $ref: '#/components/schemas/Descriptor'
        fulfillment:
          $ref: '#/components/schemas/Fulfillment'
        item:
          $ref: '#/components/schemas/Item'
        offer:
          $ref: '#/components/schemas/Offer'
        payment:
          $ref: '#/components/schemas/Payment'
        provider:
          $ref: '#/components/schemas/Provider'
        tags:
          items:
            $ref: '#/components/schemas/TagGroup'
          type: array
      type: object
    Issue:
      properties:
        actions:
          description: Describes the actions taken on the issue
          items:
            $ref: '#/components/schemas/Action'
          type: array
        actors:
          description: Describes the actors involved in the transaction
          items:
            properties:
              id:
                description: Describes id of the actors that are their
                type: string
              info:
                description: Describes the information about actor
                properties:
                  contact:
                    $ref: '#/components/schemas/Contact'
                  org:
                    type: object
                  person:
                    $ref: '#/components/schemas/Person'
                type: object
              type:
                description: Describes the type of actor
                type: string
            type: object
          type: array
        additional_info_required:
          items:
            $ref: '#/components/schemas/AdditionalInfoRequired'
          type: array
        category:
          $ref: '#/components/schemas/IssueCategory'
        complainant_id:
          description: Describes the complainant id
          type: string
        complainant_info:
          $ref: '#/components/schemas/Complainant'
        created_at:
          description: timestamp for the creation of the issue
          format: date-time
          type: string
        description:
          description: Issue description payload
          properties:
            additional_desc:
              description: Additional description file
              properties:
                content_type:
                  description: MIME type of the file
                  type: string
                url:
                  description: URL to additional description
                  format: uri
                  type: string
              required:
              - url
              - content_type
              type: object
            images:
              description: array of image URLs
              items:
                format: uri
                type: string
              required:
              - short_desc
              - long_desc
              - additional_desc
              - images
              type: array
            long_desc:
              description: detailed description of the issue
              type: string
            short_desc:
              description: short description of the issue
              type: string
          type: object
        descriptor:
          $ref: '#/components/schemas/DescriptorIgm'
        expected_resolution_time:
          $ref: '#/components/schemas/Time'
        expected_response_time:
          $ref: '#/components/schemas/Time'
        finalized_odr:
          $ref: '#/components/schemas/ODR'
        id:
          description: '* Network issue identifier is an unique number assigned to
            any complaint by the interfacing application at the source.


            * **During the life cycle of a complaint, this number will not change
            and will be communicated to counterparty application.**


            * Any subsequent issues created with the interfacing,counterpary or casacaded
            counter party apps are responsible for providing the correalted and relevant
            network-issue-id which helps all this inteacting systems to traverse back
            to the main issue.

            '
          type: string
        issue_actions:
          $ref: '#/components/schemas/IssueActions'
        issue_type:
          description: "identifies the type of the issue raised\n* the complainant\
            \ being raised can be a regular ```Issue```, \n* which then subsequently\
            \ can be escalated to be a ```Grievance``` \n* which may be further escalated\
            \ to be a ```Dispute```\n"
          enum:
          - ISSUE
          - GRIEVANCE
          - DISPUTE
          type: string
        last_action_id:
          description: Describes the last action id
          type: string
        level:
          $ref: '#/components/schemas/Level'
        order_details:
          $ref: '#/components/schemas/OrderDetails'
        rating:
          description: rating by the complainant for issue resolution
          enum:
          - THUMBS-UP
          - THUMBS-DOWN
          type: string
        refs:
          description: will give bref about refs
          items:
            properties:
              ref_id:
                type: string
              ref_type:
                type: string
            type: object
          type: array
        resolution:
          description: Resolution for the issue
          properties:
            action_triggered:
              description: action triggered for the complaint
              enum:
              - REFUND
              - REPLACEMENT
              - CANCEL
              - NO-ACTION
              - RECONCILED
              - NOT-RECONCILED
              type: string
            long_desc:
              description: detailed description of the issue action
              type: string
            refund_amount:
              description: refund amount to be initiated
              type: string
            short_desc:
              description: short description of the issue action
              type: string
          required:
          - short_desc
          - action_triggered
          type: object
        resolution_provider:
          $ref: '#/components/schemas/ResolutionProvider'
        resolutions:
          description: Describes the actions taken on the issue
          items:
            $ref: '#/components/schemas/IssueResolution'
          type: array
        resolver_ids:
          description: Describes the resolver id
          items:
            type: string
          type: array
        respondent_ids:
          description: Describes the respondent id
          items:
            type: string
          type: array
        selected_odrs_info:
          description: "details of the ODRs selected by the resolution provider .\n\
            one of this would be subsequently finalized to be the ODR resposbile to\
            \ resolve the issue . \nThis is a required object if and when the issue\
            \ type is \"Dispute\"\n"
          items:
            $ref: '#/components/schemas/SelectedODRs'
          type: array
        source:
          $ref: '#/components/schemas/IssueSource'
        source_id:
          description: Describes the source of the issue
          type: string
        status:
          description: "### Statues\n  1. Open : indicating that the issue is opened\
            \ and further action is yet to be taken on the issue\n  2. CLOSED : indicating\
            \ that the issue is closed and no further action/update/info/resolution\
            \ action/status change are expected/accepted on this issue.\n"
          enum:
          - OPEN
          - CLOSED
          - INFO_PROVIDED
          type: string
        sub_category:
          $ref: '#/components/schemas/IssueSubCategory'
        updated_at:
          description: timestamp for the capturing the time an issue was last updated
          format: date-time
          required:
          - id
          - created_at
          - updated_at
          type: string
      type: object
    IssueActions:
      properties:
        complainant_actions:
          items:
            $ref: '#/components/schemas/ComplainantAction'
          type: array
        respondent_actions:
          items:
            $ref: '#/components/schemas/RespondentAction'
          type: array
      type: object
    IssueCategory:
      description: 'Identifies what is the category of this issue

        ### CATEGORIES:

        1. Order : Indicactes that the issue is related to  Order.

        2. Transaction : Indicactes that the issue is related to  Transaction.

        3. Fulfillment : Indicactes that the issue is related to  Fulfillment.

        4. Product : Indicactes that the issue is related to  Product.

        5. Product Service : Indicactes that the issue is related to  Product Service.

        6. Service : Indicactes that the issue is related to  Service.

        7. Payment : Indicactes that the issue is related to  Payments.

        '
      type: string
    IssueResolution:
      properties:
        action:
          description: "Indicactes the action taken while addressing the issue.\n\
            \ ### Actions\n  1. resolve : indicating the issue being resolved. \n\
            \  2. reject : indicating that the issue is rejected by the respondent\
            \ or the resolution provider.\n"
          enum:
          - RESOLVE
          - REJECT
          type: string
        action_triggered:
          enum:
          - REFUND
          - REPLACEMENT
          - RETURN
          - CANCEL
          - NO-ACTION
          type: string
        descriptor:
          $ref: '#/components/schemas/Descriptor'
        gro_remarks:
          description: resolution remarks provided by the gro
          type: string
        id:
          description: unique identifier of the issue resolution
          type: string
        long_desc:
          description: remarks of the resolution of the issue by the respondent
          type: string
        odr_remarks:
          description: remarks of the result of the dispute, if applicable
          type: string
        proposed_by:
          type: string
        ref_id:
          description: Describes the reference id
          type: string
        ref_type:
          description: Describes the type of reference
          type: string
        refund_amount:
          type: string
        short_desc:
          description: resolution
          type: string
        tags:
          $ref: '#/components/schemas/Tag'
        updated_at:
          description: timestamp for the capturing the time an issue resolution was
            last updated
          format: date-time
          type: string
      type: object
    IssueSource:
      properties:
        network_participant_id:
          description: unique identifier of the network participant of the source
            of this issue. It can be one of buyer-id in the buyer- interfacing app
            , or any of the relevant network provider id based on what causes the
            issue
          type: string
        type:
          description: "Indicates the source from where the issue is raised. \n###\
            \ TYPES\n    1. Consumer : indicating that the Consumer(Buyer) of a product\
            \ or a service has raised the issue\n    2. Seller : indicating that the\
            \ Seller of a product or a service has raised the issue\n    3. Intefacing\
            \ NP : indicating that the Interfacing NP has identified and raised the\
            \ issue\n"
          enum:
          - CONSUMER
          - SELLER
          - INTERFACING-NP
          type: string
      type: object
    IssueSubCategory:
