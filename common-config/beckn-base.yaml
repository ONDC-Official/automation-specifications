          description: A string representing the boundary of the region. One-dimensional
            regions are represented by polylines. Two-dimensional regions are represented
            by polygons, and three-dimensional regions can represented by polyhedra.
          type: string
        code:
          description: A standard code representing the region. This should be interpreted
            in the same way by all network participants.
          type: string
        dimensions:
          description: The number of dimensions that are used to describe any point
            inside that region. The most common dimensionality of a region is 2, that
            represents an area on a map. There are regions on the map that can be
            approximated to one-dimensional regions like roads, railway lines, or
            shipping lines. 3 dimensional regions are rarer, but are gaining popularity
            as flying drones are being adopted for various fulfillment services.
          enum:
          - '1'
          - '2'
          - '3'
          type: string
        map_url:
          description: The url to the map of the region. This can be a globally recognized
            map or the one specified by the network policy.
          type: string
        name:
          description: Name of the region as specified on the map where that region
            exists.
          type: string
        type:
          description: The type of region. This is used to specify the granularity
            of the region represented by this object. Various examples of two-dimensional
            region types are city, country, state, district, and so on. The network
            policy should contain a list of all possible region types supported by
            the network.
          type: string
      type: object
    ReplacementTerm:
      properties:
        external_ref:
          $ref: '#/components/schemas/MediaFile'
        fulfillment_state:
          $ref: '#/components/schemas/State'
        replace_within:
          $ref: '#/components/schemas/Time'
      type: object
    ResolutionProvider:
      properties:
        respondent_info:
          description: the respondent represents the details of the entity identfied
            by the resolution provider or the complainant himself (when he has to
            select the ODRs)
          properties:
            organization:
              $ref: '#/components/schemas/Organization'
            resolution_support:
              $ref: '#/components/schemas/ResolutionSupport'
            type:
              description: 'Indicates the type of the resolution provider NP type.

                ### TYPES

                1. Interfacing NP : indicating the NP where or through which the issue
                is raised

                2. Transaction Counterparty NP : indicating the first level of transaction
                counterparty network provider with which the interfacing NP is interacting
                with to get an issue resolution.

                3. Cascaded Counterparty NP : indicating the second or any further
                downstream levels of counterparty network provider with which the
                NP is interacting with to get an issue resolution.

                '
              enum:
              - INTERFACING-NP
              - TRANSACTION-COUNTERPARTY-NP
              - CASCADED-COUNTERPARTY-NP
              type: string
          type: object
      type: object
    ResolutionSource:
      properties:
        link:
          type: string
        type:
          type: string
      type: object
    ResolutionSupport:
      properties:
        additional_sources:
          items:
            $ref: '#/components/schemas/ResolutionSource'
          type: array
        chat_link:
          description: chatbot link for the respondent for complainant to interact
            with the respondent
          type: string
        contact:
          $ref: '#/components/schemas/Contact'
        faqs:
          description: frequently asked questions for the respondent for complainant
            to get information as required
          items:
            $ref: '#/components/schemas/Faq'
          type: array
        gros:
          description: 'Details of the GRO appointed by the resolution provider to
            support in issue resolution .

            This is a required object if and when the issue type is "Grievance"

            '
          items:
            $ref: '#/components/schemas/GRO'
          type: array
      type: object
    RespondentAction:
      properties:
        cascaded_level:
          description: the default value will be 1, whenever the issue will be cascaded
            to the next level the value of this field should be incremented by 1 it
            will upgrade it indicates to the next sub-level.
          type: integer
        respondent_action:
          enum:
          - PROCESSING
          - CASCADED
          - RESOLVED
          - NEED-MORE-INFO
          type: string
        short_desc:
          description: details of the remarks when the issue status is changed, can
            be captured when the respondent triggers an action
          type: string
        updated_at:
          description: timestamp for the capturing the time an issue status was last
            updated
          format: date-time
          type: string
        updated_by:
          $ref: '#/components/schemas/Organization'
      type: object
    ReturnTerm:
      properties:
        fulfillment_managed_by:
          description: The entity that will perform the return
          enum:
          - CONSUMER
          - PROVIDER
          type: string
        fulfillment_state:
          $ref: '#/components/schemas/State'
        return_eligible:
          description: Indicates whether the item is eligible for return
          type: boolean
        return_location:
          $ref: '#/components/schemas/Location'
        return_time:
          $ref: '#/components/schemas/Time'
      type: object
    Scalar:
      properties:
        computed_value:
          $ref: '#/components/schemas/DecimalValue'
        estimated_value:
          $ref: '#/components/schemas/DecimalValue'
        range:
          additionalProperties: false
          properties:
            max:
              $ref: '#/components/schemas/DecimalValue'
            min:
              $ref: '#/components/schemas/DecimalValue'
          type: object
        type:
          enum:
          - CONSTANT
          - VARIABLE
          type: string
        unit:
          type: string
        value:
          $ref: '#/components/schemas/DecimalValue'
      type: object
    Schedule:
      properties:
        frequency:
          $ref: '#/components/schemas/Duration'
        holidays:
          items:
            format: date-time
            type: string
          type: array
        times:
          items:
            format: date-time
            type: string
          type: array
      type: object
    SelectedODRs:
      properties:
        odrs:
          items:
            $ref: '#/components/schemas/ODR'
          type: array
        respondent_info:
          $ref: '#/components/schemas/Organization'
          type: object
      type: object
    State:
      properties:
        code:
          description: State code as per country or international standards
          type: string
        descriptor:
          $ref: '#/components/schemas/Descriptor'
        name:
          description: Name of the state
          type: string
      type: object
    Stop:
      properties:
        authorization:
          $ref: '#/components/schemas/Authorization'
        contact:
          $ref: '#/components/schemas/Contact'
        id:
          type: string
        instructions:
          $ref: '#/components/schemas/Descriptor'
        location:
          $ref: '#/components/schemas/Location'
        parent_stop_id:
          type: string
        person:
          $ref: '#/components/schemas/Person'
        time:
          $ref: '#/components/schemas/Time'
        type:
          description: The type of stop. Allowed values of this property can be defined
            by the network policy.
          type: string
      type: object
    SupplementaryInformation:
      properties:
        message_id:
          type: string
        updated_at:
          description: timestamp for the capturing the time an issue was last updated
          format: date-time
          type: string
      type: object
    Support:
      properties:
        callback_phone:
          format: phone
          type: string
        email:
          format: email
          type: string
        order_id:
          type: string
        phone:
          format: phone
          type: string
        ref_id:
          type: string
        url:
          format: uri
          type: string
      type: object
    Tag:
      properties:
        descriptor:
          $ref: '#/components/schemas/Descriptor'
        display:
          description: This value indicates if the tag is intended for display purposes.
            If set to `true`, then this tag must be displayed. If it is set to `false`,
            it should not be displayed. This value can override the group display
            value.
          type: boolean
        list:
          description: List of key-value tag entries
          items:
            properties:
              descriptor:
                properties:
                  code:
                    description: Descriptor code of the individual tag
                    type: string
                required:
                - code
                type: object
              value:
                description: Value of the tag
                type: string
            required:
            - descriptor
            - value
            type: object
          type: array
        value:
          description: The value of the tag. This set by the BPP and rendered as-is
            by the BAP.
          type: string
      type: object
    TagGroup:
      properties:
        descriptor:
          $ref: '#/components/schemas/Descriptor'
        display:
          default: true
          description: Indicates the display properties of the tag group. If display
            is set to false, then the group will not be displayed. If it is set to
            true, it should be displayed. However, group-level display properties
            can be overriden by individual tag-level display property. As this schema
            is purely for catalog display purposes, it is not recommended to send
            this value during search.
          type: boolean
        list:
          description: An array of Tag objects listed under this group. This property
            can be set by BAPs during search to narrow the `search` and achieve more
            relevant results. When received during `on_search`, BAPs must render this
            list under the heading described by the `name` property of this schema.
          items:
            $ref: '#/components/schemas/Tag'
          type: array
      type: object
    Time:
      properties:
        days:
          description: comma separated values representing days of the week
          type: string
        duration:
          $ref: '#/components/schemas/Duration'
        label:
          type: string
        range:
          additionalProperties: false
          properties:
            end:
              format: date-time
              type: string
            start:
              format: date-time
              type: string
          type: object
        schedule:
          $ref: '#/components/schemas/Schedule'
        timestamp:
          format: date-time
          type: string
      type: object
    Tracking:
      properties:
        id:
          description: A unique tracking reference number
          type: string
        location:
          $ref: '#/components/schemas/Location'
        status:
          description: This value indicates if the tracking is currently active or
            not. If this value is `active`, then the BAP can begin tracking the order.
            If this value is `inactive`, the tracking URL is considered to be expired
            and the BAP should stop tracking the order.
          enum:
          - active
          - inactive
          type: string
        url:
          description: A URL to the tracking endpoint. This can be a link to a tracking
            webpage, a webhook URL created by the BAP where BPP can push the tracking
            data, or a GET url creaed by the BPP which the BAP can poll to get the
            tracking data. It can also be a websocket URL where the BPP can push real-time
            tracking data.
          format: uri
          type: string
      type: object
    Vehicle:
      properties:
        capacity:
          type: integer
        cargo_volumne:
          type: string
        category:
          type: string
        code:
          type: string
        color:
          type: string
        emission_standard:
          type: string
        energy_type:
          type: string
        make:
          type: string
        model:
          type: string
        registration:
          type: string
        size:
          type: string
        variant:
          type: string
        wheelchair_access:
          type: string
        wheels_count:
          type: string
      type: object
    XInput:
      properties:
        form:
          $ref: '#/components/schemas/Form'
        form_response:
          additionalProperties: false
          description: Describes the response to a form submission
          properties:
            errors:
              items:
                $ref: '#/components/schemas/Error'
              type: array
            signature:
              type: string
            status:
              description: Contains the status of form submission.
              type: string
            submission_id:
              type: string
          type: object
        head:
          additionalProperties: false
          description: Provides the header information for the xinput.
          properties:
            descriptor:
              $ref: '#/components/schemas/Descriptor'
            headings:
              items:
                description: The heading names of the forms
                type: string
              type: array
            index:
              additionalProperties: false
              properties:
                cur:
                  type: integer
                max:
                  type: integer
                min:
                  type: integer
              type: object
          type: object
        required:
          description: Indicates whether the form data is mandatorily required by
            the BPP to confirm the order.
          type: boolean
      type: object
info:
  description: ONDC Beckn Base
  title: ONDC Beckn Base
  version: 2.0.0
openapi: 3.0.0
paths:
  /cancel:
    post:
      description: Cancel an order
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                context:
                  allOf:
                  - $ref: '#/components/schemas/Context'
                  - properties:
                      action:
                        enum:
                        - cancel
                    required:
                    - action
                    type: object
                message:
                  additionalProperties: false
                  properties:
                    cancellation_reason_id:
                      $ref: '#/components/schemas/Option/properties/id'
                    descriptor:
                      $ref: '#/components/schemas/Descriptor'
                    order_id:
                      $ref: '#/components/schemas/Order/properties/id'
                  required:
                  - order_id
                  type: object
              required:
              - context
              - message
              type: object
      responses:
        default:
          $ref: '#/paths/~1init/post/responses/default'
      tags:
      - Provider Platform
  /confirm:
    post:
      description: Initialize an order by providing billing and/or shipping details
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                context:
                  allOf:
                  - $ref: '#/components/schemas/Context'
                  - properties:
                      action:
                        enum:
                        - confirm
                    required:
                    - action
                    type: object
                message:
                  additionalProperties: false
                  properties:
                    order:
                      $ref: '#/components/schemas/Order'
                  required:
                  - order
                  type: object
              required:
              - context
              - message
              type: object
      responses:
        default:
          $ref: '#/paths/~1init/post/responses/default'
      tags:
      - Provider Platform
  /init:
    post:
      description: Initialize an order by providing billing and/or shipping details
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                context:
                  allOf:
                  - $ref: '#/components/schemas/Context'
                  - properties:
                      action:
                        enum:
                        - init
                    required:
                    - action
                    type: object
                message:
                  additionalProperties: false
                  properties:
                    order:
                      $ref: '#/components/schemas/Order'
                  required:
                  - order
                  type: object
              required:
              - context
              - message
              type: object
      responses:
        default:
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
                  message:
                    properties:
                      ack:
                        allOf:
                        - $ref: '#/components/schemas/Ack'
                        - type: object
                        - properties:
                            status:
                              enum:
                              - ACK
                              - NACK
                    required:
                    - ack
                    type: object
                required:
                - message
                type: object
          description: Acknowledgement of message received after successful validation
            of schema and signature
      tags:
      - Provider Platform
  /issue:
    post:
      description: '###  Operation Description

        '
      requestBody:
        content:
          application/json:
            schema:
              properties:
                context:
                  $ref: '#/components/schemas/Context'
                message:
                  properties:
                    issue:
                      $ref: '#/components/schemas/Issue'
                  type: object
              required:
              - context
              - message
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
                  message:
                    properties:
                      ack:
                        $ref: '#/components/schemas/Ack'
                    required:
                    - ack
                    type: object
                required:
                - message
                type: object
          description: Acknowledgement of message received
      tags:
      - Complaint lifecycle management
  /issue_status:
    post:
      description: Request for latest status of the complaint
      requestBody:
        content:
          application/json:
            schema:
              properties:
                context:
                  $ref: '#/components/schemas/Context'
                message:
                  properties:
                    issue_id:
                      description: Network issue identifier is a unique number assigned
                        to a complaint by the interfacing application
                      type: string
                  required:
                  - issue_id
                  type: object
              required:
              - context
              - message
              type: object
        description: Seller confirms order
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
                  message:
                    properties:
                      ack:
                        $ref: '#/components/schemas/Ack'
                    required:
                    - ack
                    type: object
                required:
                - message
                type: object
          description: Acknowledgement of message received
      tags:
      - Complaint lifecycle management
  /on_cancel:
    post:
      description: Send cancellation request_id with reasons list in case of cancellation
        request. Else send cancelled order object
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                context:
                  allOf:
                  - $ref: '#/components/schemas/Context'
                  - properties:
                      action:
                        enum:
                        - on_cancel
                    required:
                    - action
                    type: object
                error:
                  $ref: '#/components/schemas/Error'
                message:
                  additionalProperties: false
                  properties:
                    order:
                      $ref: '#/components/schemas/Order'
                  required:
                  - order
                  type: object
              required:
              - context
              type: object
      responses:
        default:
          $ref: '#/paths/~1init/post/responses/default'
      tags:
      - Consumer Platform
  /on_confirm:
    post:
      description: Send active order object
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                context:
                  allOf:
                  - $ref: '#/components/schemas/Context'
                  - properties:
                      action:
                        enum:
                        - on_confirm
                    required:
                    - action
                    type: object
                error:
                  $ref: '#/components/schemas/Error'
                message:
                  additionalProperties: false
                  properties:
                    order:
                      $ref: '#/components/schemas/Order'
                  required:
                  - order
                  type: object
              required:
              - context
              type: object
      responses:
        default:
          $ref: '#/paths/~1init/post/responses/default'
      tags:
      - Consumer Platform
  /on_init:
