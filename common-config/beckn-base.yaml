        default:
          $ref: '#/paths/~1init/post/responses/default'
      tags:
      - Consumer Platform
  /on_issue:
    post:
      description: Send the issue resolution details object
      requestBody:
        content:
          application/json:
            schema:
              properties:
                context:
                  $ref: '#/components/schemas/Context'
                error:
                  $ref: '#/components/schemas/Error'
                message:
                  properties:
                    issue:
                      $ref: '#/components/schemas/Issue'
                  required:
                  - issue
                  type: object
              required:
              - context
              - message
              type: object
        description: Seller confirms order
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
                  message:
                    properties:
                      ack:
                        $ref: '#/components/schemas/Ack'
                    required:
                    - ack
                    type: object
                required:
                - message
                type: object
          description: Acknowledgement of message received
      tags:
      - Complaint lifecycle management
  /on_issue_status:
    post:
      description: Send the issue resolution details object
      requestBody:
        content:
          application/json:
            schema:
              properties:
                context:
                  $ref: '#/components/schemas/Context'
                error:
                  $ref: '#/components/schemas/Error'
                message:
                  properties:
                    issue:
                      $ref: '#/components/schemas/Issue'
                  required:
                  - issue
                  type: object
              required:
              - context
              - message
              type: object
        description: Seller confirms order
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
                  message:
                    properties:
                      ack:
                        $ref: '#/components/schemas/Ack'
                    required:
                    - ack
                    type: object
                required:
                - message
                type: object
          description: Acknowledgement of message received
      tags:
      - Complaint lifecycle management
  /on_rating:
    post:
      description: Provide feedback on a service
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                context:
                  allOf:
                  - $ref: '#/components/schemas/Context'
                  - properties:
                      action:
                        enum:
                        - on_rating
                    required:
                    - action
                    type: object
                error:
                  $ref: '#/components/schemas/Error'
                message:
                  properties:
                    order_id:
                      $ref: '#/components/schemas/Order/properties/id'
                    ratings:
                      items:
                        $ref: '#/components/schemas/Rating'
                      type: array
                  type: object
              required:
              - context
              type: object
      responses:
        default:
          $ref: '#/paths/~1init/post/responses/default'
      tags:
      - Consumer Platform
  /on_search:
    post:
      description: Provider Platform sends its catalog in response to a search request.
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                context:
                  allOf:
                  - $ref: '#/components/schemas/Context'
                  - properties:
                      action:
                        enum:
                        - on_search
                    required:
                    - action
                    type: object
                error:
                  $ref: '#/components/schemas/Error'
                message:
                  additionalProperties: false
                  properties:
                    catalog:
                      $ref: '#/components/schemas/Catalog'
                  required:
                  - catalog
                  type: object
              required:
              - context
              - message
              type: object
      responses:
        default:
          $ref: '#/paths/~1init/post/responses/default'
      tags:
      - Consumer Platform
  /on_select:
    post:
      description: Send draft order object with quoted price for selected items
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                context:
                  allOf:
                  - $ref: '#/components/schemas/Context'
                  - properties:
                      action:
                        enum:
                        - on_select
                    required:
                    - action
                    type: object
                error:
                  $ref: '#/components/schemas/Error'
                message:
                  additionalProperties: false
                  properties:
                    order:
                      $ref: '#/components/schemas/Order'
                  type: object
              required:
              - context
              - message
              type: object
      responses:
        default:
          $ref: '#/paths/~1init/post/responses/default'
      tags:
      - Consumer Platform
  /on_status:
    post:
      description: Fetch the status of a Service
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                context:
                  allOf:
                  - $ref: '#/components/schemas/Context'
                  - properties:
                      action:
                        enum:
                        - on_status
                    required:
                    - action
                    type: object
                error:
                  $ref: '#/components/schemas/Error'
                message:
                  additionalProperties: false
                  properties:
                    order:
                      $ref: '#/components/schemas/Order'
                  required:
                  - order
                  type: object
              required:
              - context
              - message
              type: object
      responses:
        default:
          $ref: '#/paths/~1init/post/responses/default'
      tags:
      - Consumer Platform
  /on_support:
    post:
      description: Contact Support
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                context:
                  allOf:
                  - $ref: '#/components/schemas/Context'
                  - properties:
                      action:
                        enum:
                        - on_support
                    required:
                    - action
                    type: object
                error:
                  $ref: '#/components/schemas/Error'
                message:
                  properties:
                    support:
                      $ref: '#/components/schemas/Support'
                  type: object
              required:
              - context
              - message
              type: object
      responses:
        default:
          $ref: '#/paths/~1init/post/responses/default'
      tags:
      - Consumer Platform
  /on_track:
    post:
      description: Send tracking details of an active order
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                context:
                  allOf:
                  - $ref: '#/components/schemas/Context'
                  - properties:
                      action:
                        enum:
                        - on_track
                    required:
                    - action
                    type: object
                error:
                  $ref: '#/components/schemas/Error'
                message:
                  additionalProperties: false
