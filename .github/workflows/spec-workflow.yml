name: Spec Workflow

on:
  push:
    branches: [ "main", "draft-*" ]
    paths:
      - 'config/**'
  workflow_dispatch:

jobs:
  process-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout pinned tooling
        uses: actions/checkout@v4
        with:
          repository: ONDC-Official/automation-specifications
          ref: main
          path: .pwb-tooling
          sparse-checkout: tooling

      - name: Install pinned tools
        run: |
          # Versions are pinned in tooling/versions.env and tooling/package.json on main.
          cp .pwb-tooling/tooling/package.json .pwb-tooling/tooling/package-lock.json .
          npm ci --no-audit --no-fund

      - name: Parse config
        id: parse
        run: |
          ./node_modules/.bin/ondc-tools parse -i config -o build.yaml

      - name: Upload parsed build.yaml artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.yaml
          retention-days: 7

      - name: Validate build.yaml
        run: |
          ./node_modules/.bin/ondc-tools validate -i build.yaml

      - name: Generate RAG Table
        run: |
          ./node_modules/.bin/ondc-tools gen-rag-table -i build.yaml -o generated

      - name: Push to DB
        # Only deploy/push on pushes to main or manual dispatch, not on PRs (optional precaution)
        if: github.event_name != 'pull_request'
        env:
          API_KEY: \${{ secrets.DB_API_KEY }}
          API_BASE_URL: \${{ secrets.DB_BASE_URL_DEV || 'https://api.example.com' }}
        run: |
          ./node_modules/.bin/ondc-tools push-to-db -f build.yaml -t generated/raw_table.json -u "$API_BASE_URL" -k "$API_KEY"
