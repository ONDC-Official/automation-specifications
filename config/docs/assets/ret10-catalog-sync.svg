weight="600" fill="#334155" text-anchor="middle">Flow 8</text><rect x="330" y="216" width="380" height="80" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6" filter="url(#sh)"/><text x="520" y="244.2286" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">PULL  ·  buyer app → seller app</text><text x="520" y="260.8714" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">/search for items changed after a given time;</text><text x="520" y="276.7414" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">seller returns only those</text><rect x="656.91" y="304" width="53.09" height="20" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/><text x="683.4549999999999" y="317.96" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Flow 9</text><path d="M710,135 L740,135 L740,192 L774,192" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a10B981)"/><path d="M710,255 L740,255 L740,192 L774,192" fill="none" stroke="#3B82F6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3B82F6)"/><rect x="780" y="150" width="190" height="84" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6" filter="url(#sh)"/><text x="875" y="180.0492" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#1E3A8A" text-anchor="middle">✅</text><text x="875" y="201.9636" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">Buyer app catalog</text><text x="875" y="220.5936" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">stays current</text>
