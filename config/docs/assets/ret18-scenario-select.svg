t-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">fulfillment Serviceable + delivery TAT</text><path d="M770,130 L814,130" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a10B981)"/><rect x="820" y="98" width="150" height="64" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6" filter="url(#sh)"/><text x="895" y="126.61899999999999" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="700" fill="#1E3A8A" text-anchor="middle">→ /init</text><text x="895" y="143.8414" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">continue order</text><rect x="916.91" y="70" width="53.09" height="20" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/><text x="943.4549999999999" y="83.96" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Flow 1</text><path d="M360,270 L360,292 L494,292" fill="none" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aEF4444)"/><rect x="365.60749999999996" y="271.5" width="108.78500000000003" height="18.5" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="420" y="284" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#991B1B" text-anchor="middle">item out of stock</text><rect x="500" y="248" width="270" height="88" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.6" filter="url(#sh)"/><text x="635" y="280.3804" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991B1B" text-anchor="middle">❌ /on_select + error 40002</text><text x="635" y="297.2164" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">quote shows only the qty available,</text><text x="635" y="313.0864" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">error.message lists the item IDs</text><path d="M770,292 L814,292" fill="none" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aEF4444)"/><rect x="820" y="260" width="150" height="64" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6" filter="url(#sh)"/><text x="895" y="288.31539999999995" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="middle">✏️ Fix the cart</text><text x="895" y="305.15139999999997" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">drop or reduce item</text><rect x="916.91" y="340" width="53.09" height="20" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/><text x="943.4549999999999" y="353.96" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Flow 2</text><path d="M895,324 L895,384 L126,384 L126,248" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3B82F6)"/><rect x="349.75" y="376.5" width="320.5" height="18.5" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="510" y="389" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="500" fill="#1E3A8A" text-anchor="middle">send /select again → clean /on_select → /init</text>
