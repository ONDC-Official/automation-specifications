<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Delivery fulfillment states (hyperlocal)">
<defs><marker id="aEF4444" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#EF4444"/></marker><marker id="aF97316" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#F97316"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.08"/></filter>
<linearGradient id="hdr" x1="0" x2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="0.5" stop-color="#10B981"/><stop offset="1" stop-color="#F59E0B"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="999" height="429" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="url(#hdr)"/>
<text x="32" y="42" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start">Delivery fulfillment states (hyperlocal)</text>
<text x="32" y="66" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="start">One rider takes the order from the restaurant to the buyer · each step is one unsolicited /on_status</text>
<line x1="95" y1="150" x2="905" y2="150" stroke="#10B981" stroke-width="5" stroke-linecap="round"/><text x="95" y="104" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">Pending</text><circle cx="95" cy="150" r="27" fill="#FFFFFF" stroke="#10B981" stroke-width="3" filter="url(#sh)"/><text x="95" y="158" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">⏳</text><text x="95" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle">order: Created / Accepted</text><text x="257" y="104" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">Packed</text><circle cx="257" cy="150" r="27" fill="#FFFFFF" stroke="#10B981" stroke-width="3" filter="url(#sh)"/><text x="257" y="158" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">📦</text><text x="257" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle">order: In-progress</text><text x="419" y="104" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">Agent-assigned</text><circle cx="419" cy="150" r="27" fill="#FFFFFF" stroke="#10B981" stroke-width="3" filter="url(#sh)"/><text x="419" y="158" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">🧑</text><text x="419" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle">order: In-progress</text><text x="581" y="104" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">Order-picked-up</text><circle cx="581" cy="150" r="27" fill="#FFFFFF" stroke="#10B981" stroke-width="3" filter="url(#sh)"/><text x="581" y="158" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">🛍️</text><text x="581" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle">order: In-progress</text><text x="743" y="104" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">Out-for-delivery</text><circle cx="743" cy="150" r="27" fill="#FFFFFF" stroke="#10B981" stroke-width="3" filter="url(#sh)"/><text x="743" y="158" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">🛵</text><text x="743" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle">order: In-progress</text><text x="905" y="104" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">Order-delivered</text><circle cx="905" cy="150" r="27" fill="#10B981" stroke="#10B981" stroke-width="3" filter="url(#sh)"/><text x="905" y="158" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">✅</text><text x="905" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle">order: Completed</text><line x1="95" y1="208" x2="95" y2="250" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="257" y1="208" x2="257" y2="250" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="419" y1="208" x2="419" y2="250" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="581" y1="208" x2="581" y2="250" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="95" y1="250" x2="581" y2="250" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="5 4"/><path d="M338,250 L338,282" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aEF4444)"/><rect x="218" y="288" width="240" height="62" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.6" filter="url(#sh)"/><text x="338" y="315.6604" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" font-weight="700" fill="#991B1B" text-anchor="middle">✖ Cancelled</text><text x="338" y="331.9996" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle">buyer cancels before delivery · Flow 4</text><path d="M743,208 L743,282" fill="none" stroke="#F97316" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aF97316)"/><rect x="746" y="232.5" width="83.94500000000002" height="18.5" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="751" y="245" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#9A3412" text-anchor="start">delivery fails</text><rect x="610" y="288" width="360" height="100" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6" filter="url(#sh)"/><text x="790" y="316.955" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12.5" font-weight="700" fill="#9A3412" text-anchor="middle">/on_cancel  ·  reason 013  ·  Flow 5</text><text x="790" y="333.7082" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9A3412" text-anchor="middle">delivery fulfillment → Cancelled</text><text x="790" y="350.2682" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9A3412" text-anchor="middle">new RTO fulfillment → RTO-Initiated</text><text x="790" y="366.8282" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9A3412" text-anchor="middle">later → RTO-Disposed</text><text x="40" y="410" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" font-style="italic">In Flow 2 (Buyer-Delivery) the buyer app reports these same states to the seller app in /update.</text>
</svg>
