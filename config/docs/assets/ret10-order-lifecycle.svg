<text x="32" y="66" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="start">Five phases from search to delivery, then post-order changes and settlement</text>
<rect x="31" y="92" width="554" height="28" rx="8" fill="#EFF6FF"/><text x="46" y="111" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A" text-anchor="start">PRE-ORDER  ·  the apps agree on cart, price and terms — nothing committed</text><rect x="607" y="92" width="362" height="28" rx="8" fill="#ECFDF5"/><text x="622" y="111" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#065F46" text-anchor="start">ORDER  ·  order ID exists, payment terms fixed</text><rect x="31" y="135" width="170" height="210" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.8" filter="url(#sh)"/><rect x="31" y="135" width="170" height="46" rx="14" fill="#FFFBEB"/><rect x="31" y="167" width="170" height="14" fill="#FFFBEB"/><circle cx="53" cy="158" r="12" fill="#F59E0B"/><text x="53" y="162.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="73" y="163" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400E" text-anchor="start">🔎 Discover</text><rect x="45" y="195" width="66.3" height="22" rx="11" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/><text x="78.15" y="210.14" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600" fill="#92400E" text-anchor="middle">/search</text><rect x="45" y="225" width="87" height="22" rx="11" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/><text x="88.5" y="240.14" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600" fill="#92400E" text-anchor="middle">/on_search</text><line x1="45" y1="263" x2="187" y2="263" stroke="#E2E8F0"/><text x="45" y="287" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Stores near buyer,</text><text x="45" y="305" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">items, MRP, price,</text><text x="45" y="323" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">pack size, stock</text><path d="M203,240 L219,240" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a94A3B8)"/><rect x="223" y="135" width="170" height="210" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.8" filter="url(#sh)"/><rect x="223" y="135" width="170" height="46" rx="14" fill="#EFF6FF"/><rect x="223" y="167" width="170" height="14" fill="#EFF6FF"/><circle cx="245" cy="158" r="12" fill="#3B82F6"/><text x="245" y="162.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="265" y="163" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A" text-anchor="start">🛒 Select</text><rect x="237" y="195" width="66.3" height="22" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2"/><text x="270.15" y="210.14" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">/select</text><rect x="237" y="225" width="87" height="22" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2"/><text x="280.5" y="240.14" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">/on_select</text><line x1="237" y1="263" x2="379" y2="263" stroke="#E2E8F0"/><text x="237" y="287" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Stock + radius check,</text><text x="237" y="305" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">quote with charges</text><text x="237" y="323" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">and delivery TAT</text><path d="M395,240 L411,240" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a94A3B8)"/><rect x="415" y="135" width="170" height="210" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.8" filter="url(#sh)"/><rect x="415" y="135" width="170" height="46" rx="14" fill="#EFF6FF"/><rect x="415" y="167" width="170" height="14" fill="#EFF6FF"/><circle cx="437" cy="158" r="12" fill="#3B82F6"/><text x="437" y="162.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="457" y="163" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A" text-anchor="start">📝 Init</text><rect x="429" y="195" width="52.5" height="22" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2"/><text x="455.25" y="210.14" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">/init</text><rect x="429" y="225" width="73.19999999999999" height="22" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2"/><text x="465.6" y="240.14" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">/on_init</text><line x1="429" y1="263" x2="571" y2="263" stroke="#E2E8F0"/><text x="429" y="287" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Address, billing,</text><text x="429" y="305" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">final quote, payment,</text><text x="429" y="323" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">cancel/return terms</text><path d="M587,240 L603,240" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a94A3B8)"/><rect x="607" y="135" width="170" height="210" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="1.8" filter="url(#sh)"/><rect x="607" y="135" width="170" height="46" rx="14" fill="#ECFDF5"/><rect x="607" y="167" width="170" height="14" fill="#ECFDF5"/><circle cx="629" cy="158" r="12" fill="#10B981"/><text x="629" y="162.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="649" y="163" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065F46" text-anchor="start">✅ Confirm</text><rect x="621" y="195" width="73.19999999999999" height="22" rx="11" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/><text x="657.6" y="210.14" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600" fill="#065F46" text-anchor="middle">/confirm</text><rect x="621" y="225" width="93.9" height="22" rx="11" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/><text x="667.95" y="240.14" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600" fill="#065F46" text-anchor="middle">/on_confirm</text><line x1="621" y1="263" x2="763" y2="263" stroke="#E2E8F0"/><text x="621" y="287" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Payment PAID, or</text><text x="621" y="305" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">NOT-PAID for COD;</text><text x="621" y="323" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">order Created</text><path d="M779,240 L795,240" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a94A3B8)"/><rect x="799" y="135" width="170" height="210" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="1.8" filter="url(#sh)"/><rect x="799" y="135" width="170" height="46" rx="14" fill="#ECFDF5"/><rect x="799" y="167" width="170" height="14" fill="#ECFDF5"/><circle cx="821" cy="158" r="12" fill="#10B981"/><text x="821" y="162.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="841" y="163" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065F46" text-anchor="start">🛵 Fulfil</text><rect x="813" y="195" width="87" height="22" rx="11" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/><text x="856.5" y="210.14" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600" fill="#065F46" text-anchor="middle">/on_status</text><rect x="813" y="225" width="142.20000000000005" height="22" rx="11" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/><text x="884.1" y="240.14" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600" fill="#065F46" text-anchor="middle">/track · /on_track</text><line x1="813" y1="263" x2="955" y2="263" stroke="#E2E8F0"/><text x="813" y="287" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Packed → picked up</text><text x="813" y="305" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">→ delivered, each as</text><text x="813" y="323" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">unsolicited on_status</text><path d="M884,345 L884,383" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a94A3B8)"/><rect x="607" y="388" width="362" height="122" rx="14" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8" filter="url(#sh)"/><text x="625" y="416" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#9A3412" text-anchor="start">🔁 After the order</text><rect x="625" y="430" width="66.3" height="22" rx="11" fill="#FFFFFF" stroke="#F97316" stroke-width="1.2"/><text x="658.15" y="445.14" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600" fill="#9A3412" text-anchor="middle">/cancel</text><rect x="699.3" y="430" width="66.3" height="22" rx="11" fill="#FFFFFF" stroke="#F97316" stroke-width="1.2"/><text x="732.4499999999999" y="445.14" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600" fill="#9A3412" text-anchor="middle">/update</text><rect x="773.5999999999999" y="430" width="59.4" height="22" rx="11" fill="#FFFFFF" stroke="#F97316" stroke-width="1.2"/><text x="803.3" y="445.14" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600" fill="#9A3412" text-anchor="middle">/issue</text><rect x="625" y="458" width="87" height="22" rx="11" fill="#FFFFFF" stroke="#F97316" stroke-width="1.2"/><text x="668.5" y="473.14" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600" fill="#9A3412" text-anchor="middle">/on_cancel</text><rect x="720" y="458" width="87" height="22" rx="11" fill="#FFFFFF" stroke="#F97316" stroke-width="1.2"/><text x="763.5" y="473.14" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600" fill="#9A3412" text-anchor="middle">/on_update</text><rect x="815" y="458" width="80.1" height="22" rx="11" fill="#FFFFFF" stroke="#F97316" stroke-width="1.2"/><text x="855.05" y="473.14" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="600" fill="#9A3412" text-anchor="middle">/on_issue</text><text x="625" y="500" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9A3412" text-anchor="start">cancel · RTO · return · replacement · complaints</text><rect x="31" y="388" width="554" height="122" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="49" y="418" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start">💰 Settle  (off-network)</text><text x="49" y="446" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Whoever collected the payment settles with the other side as agreed</text><text x="49" y="466" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">in /on_init — minus the agreed buyer app fee and taxes such as TCS / TDS.</text><text x="49" y="492" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" font-style="italic">Refunds from cancel, RTO and return reduce the amount settled.</text><path d="M607,449 L591,449" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a94A3B8)"/>
</svg>
