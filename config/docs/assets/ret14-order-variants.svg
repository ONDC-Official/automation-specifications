<rect x="180" y="88" width="320" height="56" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" filter="url(#sh)"/><text x="340" y="112.46719999999999" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">⭐ Standard order  ·  Flow 1</text><text x="340" y="129.4964" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">prepaid via buyer app · seller delivers</text><path d="M340,144 L340,166 L180,166 L180,186" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aCBD5E1)"/><rect x="30" y="190" width="300" height="188" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.8" filter="url(#sh)"/><rect x="30" y="190" width="300" height="44" rx="14" fill="#FFFBEB"/><rect x="30" y="220" width="300" height="14" fill="#FFFBEB"/><text x="46" y="218" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#92400E" text-anchor="start">💰 Payment</text><rect x="42" y="246" width="276" height="54" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-opacity="0.35"/><text x="54" y="268" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">🏦 Seller app collects</text><text x="54" y="287" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">payment collected by the seller app</text><rect x="256.90999999999997" y="254" width="53.09" height="20" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/><text x="283.455" y="267.96" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Flow 2</text><rect x="42" y="310" width="276" height="54" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-opacity="0.35"/><text x="54" y="332" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">💳 Purchase finance</text><text x="54" y="351" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">EMI or credit at checkout</text><rect x="256.90999999999997" y="318" width="53.09" height="20" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/><text x="283.455" y="331.96" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Flow 3</text><path d="M340,144 L340,166 L500,166 L500,186" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aCBD5E1)"/><rect x="350" y="190" width="300" height="124" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.8" filter="url(#sh)"/><rect x="350" y="190" width="300" height="44" rx="14" fill="#EFF6FF"/><rect x="350" y="220" width="300" height="14" fill="#EFF6FF"/><text x="366" y="218" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E3A8A" text-anchor="start">🛒 Cart and product</text><rect x="362" y="246" width="276" height="54" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-opacity="0.35"/><text x="374" y="268" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">✍️ Custom text</text><text x="374" y="287" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">for example a name to print or engrave</text><rect x="576.91" y="254" width="53.09" height="20" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/><text x="603.4549999999999" y="267.96" 