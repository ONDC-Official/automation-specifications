<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 408" width="680" height="408" role="img" aria-label="Variations on the RET14 order">
<defs><marker id="aCBD5E1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#CBD5E1"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.08"/></filter>
