        - _NAME_: REQUIRED_RECON_SETTLEMENT_AMOUNT_CURRENCY
          attr: $.message.orders[*].settlements[*].amount.currency
          _RETURN_: attr are present
        - _NAME_: REQUIRED_RECON_SETTLEMENT_AMOUNT_VALUE
          attr: $.message.orders[*].settlements[*].amount.value
          _RETURN_: attr are present
        - _NAME_: REQUIRED_RECON_SETTLEMENT_UPDATED_AT
