    - _NAME_: RECON_ORDER_REGEX
      _RETURN_:
        - _NAME_: REGEX_RECON_QUOTE_PRICE_VALUE
          attr: $.message.orders[*].quote.price.value
          reg:
            - ^-?\d+(\.\d{1,2})?$
