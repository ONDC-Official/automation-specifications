          _CONTINUE_: "!(attr are present)"
          _RETURN_: attr follow regex reg
        - _NAME_: REGEX_RECEIVER_RECON_SETTLEMENT_BANK_ACCOUNT_NO
          attr: $.message.orderbook.orders[*].payment['@ondc/org/settlement_details'][*].settlement_bank_account_no
          reg:
            - ^[0-9]{9,18}$
          _CONTINUE_: "!(attr are present)"
          _RETURN_: attr follow regex reg
        - _NAME_: REGEX_RECEIVER_RECON_SETTLEMENT_WINDOW
          attr: $.message.orderbook.orders[*].payment['@ondc/org/settlement_window']
          reg:
            - ^P(?=\d|T\d)(\d+Y)?(\d+M)?(\d+D)?(T(\d+H)?(\d+M)?(\d+S)?)?$
          _CONTINUE_: "!(attr are present)"
          _RETURN_: attr follow regex reg
        - _NAME_: REGEX_RECEIVER_RECON_RETURN_WINDOW
          attr: $.message.orderbook.orders[*].payment['@ondc/org/return_window']
          reg:
            - ^P(?=\d|T\d)(\d+Y)?(\d+M)?(\d+D)?(T(\d+H)?(\d+M)?(\d+S)?)?$
