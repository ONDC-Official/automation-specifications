            _RETURN_: attr follow regex reg
          - _NAME_: REGEX_CONTEXT_BAP_ID
            attr: $.context.bap_id
            reg: *REGEX_CONTEXT_BAP_ID
            _CONTINUE_: "!(attr are present)"
            _RETURN_: attr follow regex reg
          - _NAME_: REGEX_CONTEXT_BAP_URI
            attr: $.context.bap_uri
