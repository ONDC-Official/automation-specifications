        - _NAME_: REGEX_RECON_SETTLEMENT_TCS_VALUE
          attr: $.message.orders[*].settlements[*].tcs.value
          reg:
            - ^-?\d+(\.\d{1,2})?$
          _CONTINUE_: "!(attr are present)"
