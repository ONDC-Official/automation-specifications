    - _NAME_: RECON_SETTLED_REFERENCE
      settledStatus: $.message.orders[*].settlements[*].status
      settledValue:
        - "SETTLED"
      _CONTINUE_: "!(settledStatus any in settledValue)"
      _RETURN_:
        - _NAME_: REQUIRED_RECON_SETTLEMENT_REF_NO_FOR_SETTLED
          attr: $.message.orders[*].settlements[?(@.status=='SETTLED')].settlement_ref_no
          _RETURN_: attr are present
    - _NAME_: RECON_ORDER_UNIQUE
      _RETURN_:
