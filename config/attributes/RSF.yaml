        recon_accord:
          _description:
            required: refer to validations.yaml
            usage: false
            info: true if the receiver agrees with the information shared in recon, false otherwise
            owner: BPP
            type: boolean
        settlements:
          id:
            _description:
              required: refer to validations.yaml
