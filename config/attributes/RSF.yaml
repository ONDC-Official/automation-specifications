meta:
  use_case_id: RSF
attribute_set:
  recon:
    context:
      domain:
        _description:
          required: refer to validations.yaml
          usage: ONDC:NTS10
          info: Domain code of the Reconciliation and Settlement Framework transaction
          owner: BAP
          type: string
      location:
        country:
          code:
            _description:
              required: refer to validations.yaml
              usage: IND
              info: Country code in ISO 3166-1 format
              owner: BAP
              type: string
        city:
          code:
            _description:
              required: refer to validations.yaml
              usage: '*'
              info: City code, std:<code> or * for all cities
              owner: BAP
              type: string
      version:
        _description:
          required: refer to validations.yaml
          usage: 2.1.0
          info: Version of the RSF contract
          owner: BAP
          type: string
      action:
        _description:
          required: refer to validations.yaml
          usage: recon
          info: Describes the API being called
          owner: BAP
          type: string
      bap_id:
        _description:
          required: refer to validations.yaml
          usage: collector-app.com
          info: Subscriber ID of the collector application
          owner: BAP
          type: string
      bap_uri:
        _description:
          required: refer to validations.yaml
          usage: https://collector-app.com/ondc/1.0/
          info: Subscriber URL of the collector application
          owner: BAP
          type: string
      bpp_id:
        _description:
          required: refer to validations.yaml
          usage: receiver-app.com
          info: Subscriber ID of the receiver application
          owner: BAP
          type: string
      bpp_uri:
        _description:
          required: refer to validations.yaml
          usage: https://receiver-app.com/ondc/
          info: Subscriber URL of the receiver application
          owner: BAP
          type: string
      transaction_id:
        _description:
          required: refer to validations.yaml
          usage: bd73a366-aebb-4144-9314-808dda82c7e6
          info: Transaction ID that stays the same for all calls of one reconciliation journey
          owner: BAP
          type: string
      message_id:
        _description:
          required: refer to validations.yaml
          usage: 941ef6d7-d74d-4411-ac06-a05469c0f9ac
          info: Unique ID of this message; on_recon carries the message_id of the recon it answers
          owner: BAP
          type: string
      timestamp:
        _description:
          required: refer to validations.yaml
          usage: '2024-05-07T06:36:50.897Z'
          info: Time of generation of this call in RFC3339 format
          owner: BAP
          type: string
      ttl:
        _description:
          required: refer to validations.yaml
          usage: P1D
          info: Duration in ISO8601 format after timestamp for which this message holds valid
          owner: BAP
          type: string
    message:
      orders:
        id:
          _description:
            required: refer to validations.yaml
            usage: order-1234
            info: Order ID being reconciled
            owner: BAP
            type: string
        status:
          _description:
            required: refer to validations.yaml
            usage: COMPLETED
            info: Status of the order
            owner: BAP
            type: string
        quote:
          price:
            currency:
              _description:
                required: refer to validations.yaml
                usage: INR
                info: Currency of the order quote
                owner: BAP
                type: string
            value:
              _description:
                required: refer to validations.yaml
                usage: '300.00'
                info: Value of the order quote
                owner: BAP
                type: string
          breakup:
            '@ondc/org/item_id':
              _description:
                required: refer to validations.yaml
                usage: I1
                info: Item or fulfillment ID the breakup line belongs to
                owner: BAP
                type: string
            '@ondc/org/item_quantity':
              count:
                _description:
                  required: refer to validations.yaml
                  usage: 1
                  info: Quantity of the item
                  owner: BAP
                  type: integer
            title:
              _description:
                required: refer to validations.yaml
                usage: Atta
                info: Title of the breakup line
                owner: BAP
                type: string
            '@ondc/org/title_type':
              _description:
                required: refer to validations.yaml
                usage: item
                info: 'Type of the breakup line: item, delivery, tax, packing, misc'
                owner: BAP
                type: string
            price:
              currency:
                _description:
                  required: refer to validations.yaml
                  usage: INR
                  info: Currency of the breakup line
                  owner: BAP
                  type: string
              value:
                _description:
                  required: refer to validations.yaml
                  usage: '206.00'
                  info: Value of the breakup line
                  owner: BAP
                  type: string
            item:
              quantity:
                available:
                  count:
                    _description:
                      required: refer to validations.yaml
                      usage: '99'
                      info: Available quantity of the item
                      owner: BAP
                      type: string
                maximum:
                  count:
                    _description:
                      required: refer to validations.yaml
                      usage: '99'
                      info: Maximum quantity of the item
                      owner: BAP
                      type: string
              price:
                currency:
                  _description:
                    required: refer to validations.yaml
                    usage: INR
                    info: Currency of the item price
                    owner: BAP
                    type: string
                value:
                  _description:
                    required: refer to validations.yaml
                    usage: '206.00'
                    info: Value of the item price
                    owner: BAP
                    type: string
              tags:
                code:
                  _description:
                    required: refer to validations.yaml
                    usage: quote
                    info: Tag group code
                    owner: BAP
                    type: string
                list:
                  code:
                    _description:
                      required: refer to validations.yaml
                      usage: type
                      info: Tag code
                      owner: BAP
                      type: string
                  value:
                    _description:
                      required: refer to validations.yaml
                      usage: fulfillment
                      info: Tag value
                      owner: BAP
                      type: string
          ttl:
            _description:
              required: refer to validations.yaml
              usage: P1D
              info: Duration for which the quote holds valid
              owner: BAP
              type: string
        settlements:
          id:
            _description:
              required: refer to validations.yaml
              usage: settlement-id-456
              info: Settlement ID
              owner: BAP
              type: string
          counterparty_id:
            _description:
              required: refer to validations.yaml
              usage: receiver-app.com
              info: Subscriber ID of the counterparty of the settlement
              owner: BAP
              type: string
          payment_id:
            _description:
              required: refer to validations.yaml
              usage: pymnt-1
              info: Payment ID the settlement belongs to
              owner: BAP
              type: string
          status:
            _description:
              required: refer to validations.yaml
              usage: PENDING
              info: 'Status of the settlement: TO_BE_INITIATED, SETTLED or PENDING'
              owner: BAP
              type: string
          due_date:
            _description:
              required: refer to validations.yaml
              usage: '2024-05-08'
              info: Due date of the settlement in the next settlement cycle; sent in on_recon when recon_accord is true
              owner: BAP
              type: string
          type:
            _description:
              required: refer to validations.yaml
              usage: ''
              info: Type of the settlement
              owner: BAP
              type: string
          amount:
            currency:
              _description:
                required: refer to validations.yaml
                usage: INR
                info: Currency of the settlement amount
                owner: BAP
                type: string
            value:
              _description:
                required: refer to validations.yaml
                usage: '100.00'
                info: Value of the settlement amount
                owner: BAP
                type: string
          commission:
            currency:
              _description:
                required: refer to validations.yaml
                usage: INR
                info: Currency of the commission
                owner: BAP
                type: string
            value:
              _description:
                required: refer to validations.yaml
                usage: '10.00'
                info: Value of the commission
                owner: BAP
                type: string
          withholding_amount:
            currency:
              _description:
                required: refer to validations.yaml
                usage: INR
                info: Currency of the withholding amount
                owner: BAP
                type: string
            value:
              _description:
                required: refer to validations.yaml
                usage: '10.00'
                info: Value of the withholding amount
                owner: BAP
                type: string
          tcs:
            currency:
              _description:
                required: refer to validations.yaml
                usage: INR
                info: Currency of the TCS
                owner: BAP
                type: string
            value:
              _description:
                required: refer to validations.yaml
                usage: '10.00'
                info: Value of the TCS
                owner: BAP
                type: string
          tds:
            currency:
              _description:
                required: refer to validations.yaml
                usage: INR
                info: Currency of the TDS
                owner: BAP
                type: string
            value:
              _description:
                required: refer to validations.yaml
                usage: '10.00'
                info: Value of the TDS
                owner: BAP
                type: string
          delay_amount:
            currency:
              _description:
                required: refer to validations.yaml
                usage: INR
                info: Currency of the delay amount
                owner: BAP
                type: string
            value:
              _description:
                required: refer to validations.yaml
                usage: '20.00'
                info: Value of the delay amount
                owner: BAP
                type: string
          settlement_ref_no:
            _description:
              required: refer to validations.yaml
              usage: utr-1234
              info: Settlement reference number (UTR); sent for a SETTLED settlement
              owner: BAP
              type: string
          updated_at:
            _description:
              required: refer to validations.yaml
              usage: '2024-05-07T06:36:50.897Z'
              info: Time the settlement was last updated
              owner: BAP
              type: string
