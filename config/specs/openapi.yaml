                                  properties:
                                    currency:
                                      type: string
                                    value:
                                      type: string
                                settlement_ref_no:
                                  type: string
                                updated_at:
                                  type: string
      responses:
        '200':
          description: Synchronous ACK/NACK response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      ack:
                        properties:
