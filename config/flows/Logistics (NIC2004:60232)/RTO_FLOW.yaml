      inputs:
        id: LogisticsSearchInput
        jsonSchema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          properties:
            retailCategory:
              type: string
              description: Select retail item category
              enum:
                - F&B
                - Grocery
                - Fashion
                - BPC
                - Electronics
                - Appliances
                - Home & Kitchen
                - Health & Wellness
                - Pharma
                - Auto components
                - C2C parcels
              default: F&B
            category:
              type: string
              description: Select a delivery category
              enum:
                - Immediate Delivery
                - Standard Delivery
                - Express Delivery
                - Next Day Delivery
                - Same Day Delivery
              default: Immediate Delivery
            paymentType:
              type: string
              description: Select payment type
              enum:
                - POST-FULFILLMENT
                - ON-ORDER
              default: POST-FULFILLMENT
            city_code:
              type: string
              description: City STD code
              pattern: ^std:\d+$
              default: std:080
            start_gps:
              type: string
              description: Start GPS coordinates (lat,long)
              pattern: ^[-+]?([1-8]?\d(\.\d+)?|90(\.0+)?),\s*[-+]?(180(\.0+)?|((1[0-7]\d)|([1-9]?\d))(\.\d+)?)$
              default: 12.4535,77.9283
            end_gps:
              type: string
              description: End GPS coordinates (lat,long)
              pattern: ^[-+]?([1-8]?\d(\.\d+)?|90(\.0+)?),\s*[-+]?(180(\.0+)?|((1[0-7]\d)|([1-9]?\d))(\.\d+)?)$
              default: 12.4535,77.9283
            start_code:
              type: string
              description: Start area pincode
              pattern: ^\d{6}$
              default: "560001"
            end_code:
              type: string
              description: End area pincode
              pattern: ^\d{6}$
              default: "560001"
          required:
            - retailCategory
            - category
            - paymentType
            - city_code
            - start_gps
            - end_gps
            - start_code
            - end_code
          additionalProperties: false
