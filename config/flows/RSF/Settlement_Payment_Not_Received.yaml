  version: 1.0.0
  flowId: Settlement_Payment_Not_Received
  flowName: Settlement Reconciliation - Payment Not Received
  config_version: 0.0.0001
  description: 'Reconciliation initiated by the receiver for an order that was not paid: the receiver sends an unsolicited on_receiver_recon flagging the missing settlement, the collector settles it and sends receiver_recon, and the receiver confirms with on_receiver_recon.'
  use_case_id: RSF
transaction_data:
  transaction_id: e2f3a4b5-c6d7-4e8f-9a0b-1c2d3e4f5a33
  latest_timestamp: '1970-01-01T00:00:00.000Z'
  bap_id: bap.example.com
  bap_uri: https://bap.example.com
  bpp_id: dev-workbench.ondc.tech
  bpp_uri: https://dev-workbench.ondc.tech/api-service/ONDC:NTS10/1.0.0/seller
steps:
- api: on_receiver_recon
  action_id: on_receiver_recon_1
  owner: BPP
  responseFor: null
  unsolicited: true
  description: The receiver (BPP) raises an unsolicited on_receiver_recon for an order that was never paid (counterparty_recon_status 04, code missing) with the amount it expects.
  mock:
    generate: 
    validate: 
    requirements: 
    defaultPayload:
      context: &id001
        domain: ONDC:NTS10
        country: IND
        city: std:080
        action: on_receiver_recon
        core_version: 1.0.0
        bap_id: bap.example.com
        bap_uri: https://bap.example.com
        bpp_id: dev-workbench.ondc.tech
        bpp_uri: https://dev-workbench.ondc.tech/api-service/ONDC:NTS10/1.0.0/seller
