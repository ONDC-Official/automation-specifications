      missing_order_id: $.message.orderbook.orders[0].id
      missing_order_transaction_id: $.message.orderbook.orders[0].transaction_id
      missing_diff_value: $.message.orderbook.orders[0].counterparty_diff_amount.value
    inputs:
      id: nts10_missing_order_input
      jsonSchema:
        $schema: http://json-schema.org/draft-07/schema#
        type: object
        additionalProperties: false
        properties:
          order_id:
            type: string
            description: ID of the order that was not paid
            default: O1
          transaction_id:
            type: string
            description: Transaction ID of the order
            default: 3df395a9-c196-4678-a4d1-5eaf4f7df8dc
          diff_amount:
            type: string
            description: Amount (INR) the receiver expects for the order that was not paid
            default: '500'
            pattern: ^(?!0+(\.0+)?$)\d+(\.\d{1,2})?$
        required:
        - transaction_id
        - diff_amount
  examples:
  - name: example for on_receiver_recon
