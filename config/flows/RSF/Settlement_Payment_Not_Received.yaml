        message_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c01
        timestamp: '2026-10-12T10:34:58.469Z'
        ttl: P2D
      message:
        orderbook:
          orders:
          - id: O1
            collector_app_id: bap.example.com
            receiver_app_id: dev-workbench.ondc.tech
            order_recon_status: '02'
            transaction_id: 3df395a9-c196-4678-a4d1-5eaf4f7df8dc
            counterparty_recon_status: '04'
            counterparty_diff_amount:
              currency: INR
              value: '500'
            message:
              name: order not settled
              code: missing
    saveData:
      transactionId: $.context.transaction_id
      latestMessage_id: $.context.message_id
      latestTimestamp: $.context.timestamp
      bapId: $.context.bap_id
      bapUri: $.context.bap_uri
