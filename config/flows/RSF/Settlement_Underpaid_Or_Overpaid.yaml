              description: Transaction ID of the order
              default: 3df395a9-c196-4678-a4d1-5eaf4f7df8dc
            order_amount:
              type: string
              description: Order amount / payment order value (INR)
              default: "1200"
              pattern: ^\d+(\.\d{1,2})?$
            buyer_finder_fees_type:
              type: string
              description: Buyer finder fees type
              default: Percentage
              enum:
                - percent
                - amount
                - Percentage
            buyer_finder_fees_amount:
              type: string
              description: Buyer finder fees amount / value
              default: "5"
              pattern: ^\d+(\.\d{1,2})?$
            settlement_amount:
              type: number
              description: Settlement amount (INR)
              default: 1000
            order_settlement_ref_no:
              type: string
              description: Order-level settlement reference number
                (order.settlement_reference_no)
              default: SREF1
            settlement_detail_ref_no:
              type: string
              description: Settlement reference (UTR) inside settlement_details
                (settlement_details[].settlement_reference)
              default: SREF1
            deduction_by_collector_amount:
              type: string
              description: Amount deducted by the collector (INR)
              default: "100"
              pattern: ^\d+(\.\d{1,2})?$
            settlement_id:
              type: string
              description: Settlement ID
              default: "123123"
          required:
