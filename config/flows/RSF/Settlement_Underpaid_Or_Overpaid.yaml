meta:
  domain: ONDC:NTS10
  version: 1.0.0
  flowId: Settlement_Underpaid_Or_Overpaid
  flowName: Settlement Reconciliation - Underpaid or Overpaid
  config_version: 0.0.0001
  description: "Reconciliation where the settled amount deviates from the expected
    amount: the receiver reports an underpaid or overpaid order in
    on_receiver_recon, the collector settles the difference and sends
    receiver_recon with multiple settlement_details, and the receiver confirms
    with on_receiver_recon."
  use_case_id: RSF
