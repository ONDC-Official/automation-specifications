  version: 2.1.0
  flowId: RECON
  flowName: RECON
  config_version: 0.0.0001
  description: Reconciliation through the recon and on_recon APIs. The collector sends /recon with the order and settlement details, the receiver responds with on_recon expressing disagreement (recon_accord false) with the difference (diff_value) for the unsettled settlements, the collector sends /recon again agreeing to the counterparty values, and the receiver responds with on_recon agreeing (recon_accord true) and the due date for the settlement in the next cycle.
  use_case_id: RSF
