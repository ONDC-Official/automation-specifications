      on_recon_order: $.message.orders[*]
    inputs:
      id: rsf_on_recon_input
      jsonSchema:
        $schema: http://json-schema.org/draft-07/schema#
        type: object
        properties:
          recon_accord:
            type: boolean
            description: 'recon_accord: false = receiver disagrees (diff_value is reported), true = receiver agrees (no diff_value)'
            default: false
          settlement_diffs:
            type: array
            description: Differences reported for settlements that are not SETTLED (used when recon_accord is false). Fields not listed get diff_value 0.00.
            default:
            - settlement_id: settlement-id-456
              field: amount
              collector_value: '120.00'
              diff_value: '20.00'
            - settlement_id: settlement-id-456
              field: delay_amount
              collector_value: '20.00'
              diff_value: '20.00'
            - settlement_id: settlement-id-112
              field: amount
              collector_value: '90.00'
              diff_value: '10.00'
            items:
              type: object
              properties:
                settlement_id:
                  type: string
                  title: Settlement ID (from recon)
                field:
                  type: string
                  title: Field
                  enum:
                  - amount
                  - commission
                  - withholding_amount
                  - tcs
                  - tds
                  - delay_amount
                collector_value:
                  type: string
                  title: Value held by the receiver
                  pattern: ^\d+(\.\d{1,2})?$
                diff_value:
                  type: string
                  title: diff_value (blank = computed from recon)
                  pattern: ^\d+(\.\d{1,2})?$
              required:
              - settlement_id
              - field
              - collector_value
        required:
        - recon_accord
