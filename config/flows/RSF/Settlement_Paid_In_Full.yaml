    inputs:
      id: nts10_receiver_recon_input
      jsonSchema:
        $schema: http://json-schema.org/draft-07/schema#
        type: object
        additionalProperties: false
        properties:
          bpp_id:
            type: string
            description: Subscriber ID of the receiver app (BPP)
            default: dev-workbench.ondc.tech
            pattern: ^(?!.*\b(?:http|https|www)\b)[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+$
          bpp_uri:
            type: string
            description: Subscriber URL of the receiver app (BPP)
            default: https://dev-workbench.ondc.tech/api-service/ONDC:NTS10/1.0.0/seller
            pattern: ^https?://([a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)*|localhost)(:\d+)?(/.*)?$
          provider_name:
            type: string
            description: Provider name
            default: SABJI XPRESS PVT LTD - BANASWADI
          provider_code:
            type: string
            description: Provider ID
            default: 18275-ONDC-1
          order_id:
            type: string
            description: Order ID
            default: O1
          transaction_id:
            type: string
            description: Transaction ID of the order
            default: 3df395a9-c196-4678-a4d1-5eaf4f7df8dc
          order_amount:
            type: string
            description: Order amount / payment order value (INR)
            default: '1200'
            pattern: ^\d+(\.\d{1,2})?$
          buyer_finder_fees_type:
            type: string
            description: Buyer finder fees type
            default: Percentage
            enum:
            - percent
            - amount
            - Percentage
          buyer_finder_fees_amount:
            type: string
            description: Buyer finder fees amount / value
            default: '5'
            pattern: ^\d+(\.\d{1,2})?$
          settlement_amount:
            type: number
            description: Settlement amount (INR)
            default: 1100
          order_settlement_ref_no:
            type: string
            description: Order-level settlement reference number (order.settlement_reference_no)
            default: SREF1
          settlement_detail_ref_no:
            type: string
            description: Settlement reference (UTR) inside settlement_details (settlement_details[].settlement_reference)
            default: SREF1
          deduction_by_collector_amount:
            type: string
            description: Amount deducted by the collector (INR)
            default: '100'
            pattern: ^\d+(\.\d{1,2})?$
          settlement_id:
            type: string
            description: Settlement ID
            default: '123123'
        required:
        - bpp_id
        - bpp_uri
        - provider_name
        - provider_code
        - order_id
        - transaction_id
        - order_amount
        - buyer_finder_fees_type
        - buyer_finder_fees_amount
        - settlement_amount
        - order_settlement_ref_no
        - settlement_detail_ref_no
        - deduction_by_collector_amount
        - settlement_id
