                category: AIRLINE
            provider:
              items:
                - descriptor:
                    name: Adult
                    code: ADULT_TICKET
                  quantity:
                    selected:
                      count: 3
                - descriptor:
                    name: Child
                    code: CHILD_TICKET
                  quantity:
                    selected:
                      count: 2
            payment:
              tags:
                - descriptor:
                    code: BUYER_FINDER_FEES
                  display: false
                  list:
                    - descriptor:
                        code: BUYER_FINDER_FEES_PERCENTAGE
