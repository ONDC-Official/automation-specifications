                - BUSINESS
                - FIRST_CLASS
                - PREMIUM_ECONOMY
              default: ECONOMY
              x-payloadField: $.message.intent.category.descriptor.code
            adult_ticket_count:
              type: integer
              description: Adult Ticket Count
              x-payloadField: $.message.intent.provider.items[?(@.descriptor.code=='ADULT_TICKET')].quantity.count
              default: 2
            child_ticket_count:
              type: integer
              description: Child Ticket Count
              x-payloadField: $.message.intent.provider.items[?(@.descriptor.code=='CHILD_TICKET')].quantity.count
              default: 0
            journey_date:
              type: string
              description: Enter Journey date (YYYY-MM-DD)
              format: date
              x-payloadField: $.message.intent.fulfillment.stops[0].time.timestamp
              default: 2026-11-04T00:00:00.000Z
          required:
            - city_code
            - start_location
            - end_location
            - category
            - adult_ticket_count
            - journey_date
          additionalProperties: false
        sampleData:
