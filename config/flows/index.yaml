flows:
  - type: playground
    id: RECON_buyer_initiated
    usecase: RSF
    tags:
      - WORKBENCH
      - REPORTABLE
    description: "Reconciliation through recon and on_recon: the collector sends recon, the receiver responds with on_recon expressing disagreement (recon_accord false) with the difference per unsettled settlement, the collector sends recon again agreeing to the counterparty values, and the receiver responds with on_recon agreeing (recon_accord true)."
    config:
      $ref: ./RSF/RECON_buyer_initiated.yaml
  - type: playground
    id: ERROR_on_recon
    usecase: RSF
    tags:
      - WORKBENCH
      - REPORTABLE
    description: "Reconciliation where the receiver cannot match the order: the collector sends recon and the receiver responds with on_recon carrying error 70030 (Invalid Order Id)."
    config:
      $ref: ./RSF/ERROR_on_recon.yaml
