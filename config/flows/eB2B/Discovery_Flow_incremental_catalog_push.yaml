meta:
  domain: ONDC:RETeB2B
  version: 1.2.5
  flowId: Discovery_Flow_incremental_catalog_push
  description: An eB2B incremental catalog push scenario where a buyer platform subscribes to continuous catalog updates from a distributor, receives unsolicited item change, store-close, and store-reopen pushes, then unsubscribes.
  flowName: Discovery flow incremental catalog push
  use_case_id: eB2B
transaction_data:
  transaction_id: b385ea70-3088-4fbc-821e-916c4e78e52f
  latest_timestamp: 1970-01-01T00:00:00.000Z
  bap_id: sample-bap-id
  bap_uri: https://bap.example.com
  bpp_id: sample-bpp-id
  bpp_uri: https://bpp.example.com
steps:
  - api: search
    action_id: search_inc
    owner: BAP
    responseFor: null
    unsolicited: false
    description: The BAP subscribes to incremental catalog updates from the SNP by sending a search request with the catalog_inc tag mode set to start.
    mock:
      generate: 
      validate: 
      requirements: 
      defaultPayload:
        context:
          domain: ONDC:RETeB2B
          action: search
          country: IND
          city: std:080
          core_version: 1.2.5
          transaction_id: T1
          message_id: M1
          bap_id: sample-bap-id
          bap_uri: https://bap.example.com
          timestamp: 2025-01-08T08:00:00.000Z
          ttl: PT30S
        message:
          intent:
            payment:
              "@ondc/org/buyer_app_finder_fee_type": percent
              "@ondc/org/buyer_app_finder_fee_amount": "3.54"
            tags:
              - code: bap_terms
                list:
                  - code: static_terms
                    value: "https://buyerapp.com/ondc/terms-and-conditions"
                  - code: static_terms_new
                    value: https://github.com/ONDC-Official/NP-Static-Terms/buyerNP_BNP/1.0/tc.pdf
                  - code: effective_date
                    value: 2025-02-01T00:00:00.000Z
              - code: catalog_inc
                list:
                  - code: mode
                    value: start
      saveData:
        transactionId: $.context.transaction_id
        latestMessage_id: $.context.message_id
        latestTimestamp: $.context.timestamp
        bapId: $.context.bap_id
        bapUri: $.context.bap_uri
        bppId: $.context.bpp_id
        bppUri: $.context.bpp_uri
        inc_mode: $.message.intent.tags[?(@.code=='catalog_inc')].list[0].value
      inputs:
        id: ExampleInputId
        jsonSchema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          properties:
            city:
              type: string
              description: Enter the city code
              minLength: 1
              default: std:080
          required:
            - city
          additionalProperties: false
    examples:
      - name: example for search
        payload:
          context:
            domain: ONDC:RETeB2B
            action: search
            timestamp: 2026-08-27T08:00:00.000Z
            transaction_id: b385ea70-3088-4fbc-821e-916c4e78e52f
            message_id: 1a2b3c4d-0001-4aaa-8bbb-000000000001
