        type: request
        description: The BAP sends a confirm request to the BPP to formally place the
          F&B order, locking in the buyer-selected items, applicable offers,
          fulfillment details, billing information, and payment terms negotiated
          during the preceding init and select exchanges. This step constitutes
          the buyer's binding acceptance of the quoted order, and upon
          successful processing the BPP responds with an on_confirm callback
          that establishes the order ID, confirmed state, and any seller-side
          fulfillment or pricing adjustments reflecting the applied offers.
  - api: on_confirm
    action_id: on_confirm
    owner: BPP
    responseFor: confirm
    unsolicited: false
