      acknowledging the order, returning the confirmed order ID and state, and
      providing the final offer-adjusted quote and fulfillment details that
      reflect any applied promotional pricing. This step closes the order
      placement handshake, giving the BAP the authoritative record of the
      accepted order as recognized by the seller.
